server {
    listen 80;
    # Also serve IPv6: inside the container "localhost" resolves to ::1 first,
    # so an IPv4-only listener makes the healthcheck fail against a site that
    # is otherwise served correctly.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable: a new build produces a new filename.
    # `=404` rather than the SPA fallback below — without it a missing asset
    # would be answered with index.html, so the browser would receive HTML where
    # it expected CSS or JavaScript and fail confusingly.
    location /assets/ {
        try_files $uri =404;
        # One header only: `expires` would emit a second, competing Cache-Control.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html must never be cached: it is what points at the hashed assets,
    # so a stale copy would reference files that no longer exist after a
    # redeploy and leave the user on a blank page.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
